# Netlify deployment config — an OPTIONAL convenience path for spinning up a quick, publicly
# reachable demo (frontend + backend on one origin) without standing up your own server. The
# documented, primary way to run this app in production is still the plain Node/Express +
# PostgreSQL setup described in README.md — this file exists alongside it, not instead of it.
#
# The database is a plain external PostgreSQL instance, set as a normal DATABASE_URL env var —
# same as the primary deployment path. (Netlify's own "Netlify DB" auto-provisioning integration
# was tried first here and turned out to be deprecated — its extension page states new database
# creation is no longer available through it — hence a plain external Postgres instead.) Because
# this deployment's operator has no direct network path to that database themselves, schema +
# demo data are applied via a one-time, secret-protected bootstrap route
# (backend/src/routes/bootstrap.routes.js) called once after the first deploy, rather than by
# running `prisma migrate deploy` out-of-band as the primary deployment path does.
#
# Known limitations of this deployment path (see README.md "Netlify demo deployment" section):
#   - Serverless functions have an ephemeral filesystem, so uploaded property photos do not
#     persist between invocations. Everything else (auth, RBAC, the contact-redaction logic,
#     payments, reviews, landlord/admin dashboards) works identically to the Node/Express path.
#   - M-Pesa STK Push still requires real Safaricom Daraja credentials to be set as env vars;
#     without them, "Pay & Unlock" fails gracefully with a clean error, same as any deployment.

[build]
  publish = "frontend"
  functions = "netlify/functions"
  command = "npm install && cd backend && npm install"

[functions]
  node_bundler = "esbuild"
  # Prisma's query engine ships as a native binary that esbuild (a JS-only bundler) doesn't follow
  # through the generated client's dynamic require() of it — without this, the file never makes it
  # into the deployed function package and every database query fails at runtime. sharp is loaded
  # lazily in code specifically so it does NOT need to be in this list; if its binary has the same
  # problem, only photo processing breaks instead of the whole app. The two .sql files are read
  # directly by the bootstrap route (see above) and aren't picked up by requiring anything, so
  # they also need to be listed explicitly.
  included_files = [
    "backend/node_modules/.prisma/client/*.node",
    "backend/node_modules/.prisma/client/schema.prisma",
    "backend/prisma/migrations/20260921193359_init/migration.sql",
    "backend/prisma/seed-demo.sql"
  ]

# Send every /api/* and /health request to the single Express app wrapped as one Netlify Function,
# so all existing Express routes/middleware/services work unchanged instead of being rewritten as
# many small functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/api/media/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
